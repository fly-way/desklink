<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>DeskLink</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="menubar">
    <span class="menu-brand" aria-hidden="true">
      <svg class="app-mark" viewBox="0 0 24 13" width="24" height="13">
        <circle cx="5.5" cy="6.5" r="4.5"/><circle cx="18.5" cy="6.5" r="4.5"/><rect x="7" y="5" width="10" height="3" rx="1.5"/>
      </svg>
    </span>
    <span class="menu-app">DeskLink</span>
    <nav class="menu-items">
      <span>文件</span><span>编辑</span><span>显示</span><span>窗口</span><span>帮助</span>
    </nav>
    <span class="menu-right" id="menuClock">--:--</span>
  </div>

  <div class="window">
    <header class="titlebar">
      <div class="titlebar-left">
        <svg class="app-mark sm" viewBox="0 0 24 13" width="18" height="10">
          <circle cx="5.5" cy="6.5" r="4.5"/><circle cx="18.5" cy="6.5" r="4.5"/><rect x="7" y="5" width="10" height="3" rx="1.5"/>
        </svg>
        <span class="status-dot" id="titleStatus"></span>
        <span class="muted" id="titleStatusText">未连接</span>
      </div>

      <h1 class="window-title" id="windowTitle">概览</h1>

      <div class="titlebar-right">
        <div class="window-controls">
          <button class="win-btn" data-action="minimize" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 11 11" width="11" height="11"><path d="M1.5 5.5h8"/></svg>
          </button>
          <button class="win-btn" data-action="zoom" title="最大化" aria-label="最大化">
            <svg viewBox="0 0 11 11" width="11" height="11"><rect x="1.5" y="1.5" width="8" height="8" rx="1"/></svg>
          </button>
          <button class="win-btn close" data-action="close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 11 11" width="11" height="11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="split">
      <aside class="sidebar">
        <div class="side-group">
          <div class="side-title">DeskLink</div>
          <button class="side-item is-active" data-view="overview">
            <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6"/><path d="M8 8l3-2.5"/></svg>
            <span>概览</span>
          </button>
          <button class="side-item" data-view="tunnel">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M6.5 9.5l3-3"/><path d="M5 6l-1.5 1.5a2.8 2.8 0 004 4L9 13"/><path d="M11 10l1.5-1.5a2.8 2.8 0 00-4-4L7 6"/></svg>
            <span>隧道</span>
          </button>
          <button class="side-item" data-view="tools">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M10.5 3.5a3 3 0 00-3.8 3.8L3 11l2 2 3.7-3.7a3 3 0 003.8-3.8l-2 2-2-2z"/></svg>
            <span>工具</span>
          </button>
          <button class="side-item" data-view="logs">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M4 4h8M4 8h8M4 12h5"/></svg>
            <span>日志</span>
          </button>
          <button class="side-item" data-view="diagnostics">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 8h3l1.5-3 2.5 6 1.5-3h3.5"/></svg>
            <span>诊断</span>
          </button>
        </div>
      </aside>

      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
